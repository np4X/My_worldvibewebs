name: Render draw.io to PNG

on:
  push:
    paths:
      - "Circuits_elements/*.drawio"

permissions:
  contents: write

jobs:
  render:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export drawio files to PNG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: Circuits_elements
          format: png
          action-mode: all
          output: "."
          remove-page-suffix: true

      - name: Commit rendered PNGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-render draw.io PNGs [skip ci]"
          file_pattern: "Circuits_elements/*.png"
